name: 'Bug report: Quasar CLI'
description: '@quasar/cli or @quasar/app-vite: commands, quasar.config, dev server, builds, app modes, App Extensions'
labels: ['kind/bug 🐞', 'area/cli']

body:
  - type: markdown
    attributes:
      value: |
        ### Read Before Proceeding Further

        This form is for submitting a **bug report** for the Quasar CLI (`@quasar/cli` and `@quasar/app-vite`): commands, `quasar.config` file, dev server, builds, the SPA/SSR/SSG/PWA/Electron/Cordova/Capacitor/BEX modes and the App Extension API.
        If the problem is in a Quasar component, directive, plugin or composable, use the Quasar UI form instead. If you are just seeking help or would like to submit a feature request, go back and choose a more suitable option from the list.

        Also, search for your issue in the repo to be sure it doesn't exist already.

        To enter your issue, fill out the form correctly and according to the instructions. Try to be as clear as possible and provide as many details as possible, to help our team better understand the issue and to resolve it faster.
        Issues with an unclear description or lacking information will have a lower priority. They may even get closed without taking action.

        Lastly, read the [Reporting an Issue | Contribution Guide](https://quasar.dev/how-to-contribute/contribution-guide#reporting-an-issue) section of our docs for a more detailed explanation.

        Thanks for your understanding. We truly appreciate your effort to fill out this form!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clearly and concisely explain the problem.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: repro-url
    attributes:
      label: Reproduction URL
      description: |
        A [reproduction](https://stackoverflow.com/help/minimal-reproducible-example) URL is **REQUIRED**, even if you think the error is obvious.
        Fork [StackBlitz](https://stackblitz.quasar.dev), hit save then copy-paste the URL here.
        _If the problem cannot be shown on StackBlitz (native modes, Electron, build output), provide a minimal GitHub repo scaffolded with `npm init quasar@latest`. Keep in mind that it will be prioritized less as it makes the reproduction process slower._
      placeholder: https://stackblitz.com/edit/quasarframework-xxxxxx - DO NOT use this example value or a random URL
    validations:
      required: true
  - type: textarea
    id: repro-description
    attributes:
      label: How to reproduce?
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to the provided reproduction link
        2. Run '....'
        3. See the error
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran, with all its flags.
      placeholder: quasar dev -m ssr
    validations:
      required: true
  - type: dropdown
    id: modes
    attributes:
      label: App modes
      description: Mark the modes in which you see the problem on.
      multiple: true
      options:
        - SPA
        - SSR
        - SSG
        - PWA
        - Electron
        - Cordova
        - Capacitor
        - BEX
    validations:
      required: true
  - type: textarea
    id: q-info
    attributes:
      label: Quasar info output
      description: |
        Run [`quasar info`](https://quasar.dev/quasar-cli-vite/commands-list#info) in your project, then copy and paste the output.
        _This will be automatically formatted into code, so no need for backticks._
      render: Shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Please copy and paste any relevant log output.
        _This will be automatically formatted into code, so no need for backticks._
      render: Shell
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here, such as the relevant part of your `quasar.config` file.
