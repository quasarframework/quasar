name: Project creation tests

on:
  workflow_dispatch:
  release:
    types:
      - released # A release was published, or a pre-release was changed to a release.
  pull_request:
    types: [opened, synchronize]
    branches:
      - 'dev'
    paths:
      - '.github/workflows/project-creation-tests.yml'
      - 'create-quasar/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'pull_request' ||

        startsWith(github.event.release.tag_name, 'quasar') ||
        startsWith(github.event.release.tag_name, '@quasar/extras') ||
        startsWith(github.event.release.tag_name, '@quasar/app-vite')
      }}

    permissions:
      contents: read # to fetch code (actions/checkout)

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: create-quasar

    name: Unit tests for create-quasar
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Run unit tests
        run: pnpm test:unit

  test-app:
    needs: unit-tests

    permissions:
      contents: read # to fetch code (actions/checkout)

    runs-on: ubuntu-latest

    env:
      # See https://github.com/yarnpkg/yarn/issues/9015
      SKIP_YARN_COREPACK_CHECK: 1

    defaults:
      run:
        working-directory: create-quasar

    strategy:
      fail-fast: false
      matrix:
        install: [pnpm, npm, yarn]
        script: [js, ts]
        engine: [vite-3]
        linter: [oxlint, eslint]
        fbr: [true, false]
        allPresets: [true, false]

    name: app-${{ matrix.script }}-${{ matrix.install }}-${{ matrix.engine }}-${{ matrix.linter }}${{ matrix.fbr == true && '-fbr' || '' }}${{ matrix.allPresets == true && '-allPresets' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      # pnpm
      - name: Get pnpm store directory
        if: ${{ matrix.install == 'pnpm' }}
        id: pnpm-cache
        run: |
          echo "PNPM_CACHE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        if: ${{ matrix.install == 'pnpm' }}
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.PNPM_CACHE_PATH }}
          key: pnpm-cache-app-${{ matrix.script }}-${{ matrix.engine }}-${{ matrix.linter }}
          restore-keys: |
            pnpm-cache-app-${{ matrix.script }}-${{ matrix.engine }}-
            pnpm-cache-app-

      # yarn
      - name: Get yarn cache directory
        if: ${{ matrix.install == 'yarn' }}
        id: yarn-cache
        run: |
          echo "YARN_CACHE_PATH=$(yarn cache dir)" >> $GITHUB_OUTPUT
      - name: Setup yarn cache
        if: ${{ matrix.install == 'yarn' }}
        uses: actions/cache@v5
        with:
          path: ${{ steps.yarn-cache.outputs.YARN_CACHE_PATH }}
          key: yarn-cache-app-${{ matrix.script }}-${{ matrix.engine }}-${{ matrix.linter }}
          restore-keys: |
            yarn-cache-app-${{ matrix.script }}-${{ matrix.engine }}-
            yarn-cache-app-

      # npm
      - name: Get npm cache directory
        if: ${{ matrix.install == 'npm' }}
        id: npm-cache
        run: |
          echo "NPM_CACHE_PATH=$(npm config get cache)" >> $GITHUB_OUTPUT
      - name: Setup npm cache
        if: ${{ matrix.install == 'npm' }}
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache.outputs.NPM_CACHE_PATH }}
          key: npm-cache-app-${{ matrix.script }}-${{ matrix.engine }}-${{ matrix.linter }}
          restore-keys: |
            npm-cache-app-${{ matrix.script }}-${{ matrix.engine }}-
            npm-cache-app-

      # scaffolds the project (with dependency install), then lints it,
      # builds it and boots the dev server
      - name: Test the project creation
        env:
          E2E_INSTALL: ${{ matrix.install }}
          E2E_SCRIPT: ${{ matrix.script }}
          E2E_LINTER: ${{ matrix.linter }}
          E2E_FBR: ${{ matrix.fbr }}
          E2E_ALL_PRESETS: ${{ matrix.allPresets }}
        run: pnpm test:e2e:app

  test-ae:
    needs: unit-tests

    permissions:
      contents: read # to fetch code (actions/checkout)

    runs-on: ubuntu-latest

    env:
      # See https://github.com/yarnpkg/yarn/issues/9015
      SKIP_YARN_COREPACK_CHECK: 1

    defaults:
      run:
        working-directory: create-quasar

    strategy:
      fail-fast: false
      matrix:
        script: [js, ts]
        lint: [true, false]

    name: ae-${{ matrix.script }}${{ matrix.lint == true && '-lint' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "PNPM_CACHE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.PNPM_CACHE_PATH }}
          key: pnpm-cache-ae-${{ matrix.script }}-${{ matrix.lint }}

      # scaffolds the App Extension (with dependency install), then
      # lints it and boots the playground dev server
      - name: Test the project creation
        env:
          E2E_SCRIPT: ${{ matrix.script }}
          E2E_LINT: ${{ matrix.lint }}
        run: pnpm test:e2e:ae
