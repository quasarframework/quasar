name: UI tests

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - 'dev'
    paths:
      - '.github/workflows/ui-tests.yml'
      - 'ui/**/*.js'
      # JSON API files, validated by the specs tooling
      - 'ui/src/**/*.json'
      - 'ui/src/css/**'
      - 'ui/package.json'
      - 'ui/playground/package.json'
      # root dependency changes affect every package
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read # to fetch code (actions/checkout)

    runs-on: ubuntu-latest

    name: Build the packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Build the UI package
        working-directory: ui
        run: pnpm build

      - name: Upload UI build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-build
          path: ui/dist

  tests:
    # If the build pipeline doesn't succeed, we don't need to run tests at all
    needs: build

    permissions:
      contents: read # to fetch code (actions/checkout)
      actions: read # to correctly identify workflow run

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    name: Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      # Playwright validates browser revisions by directory, so restoring
      # a stale cache just triggers a fresh download of the right one
      - name: Setup Playwright browser cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: pnpm --filter quasar-ui-test exec playwright install --with-deps chromium

      - name: Download UI build artifact
        uses: actions/download-artifact@v8
        with:
          name: ui-build
          path: ui/dist

      - name: Run tests
        run: pnpm test

      # Upload required artifacts to be used in ui-tests-report.yml

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ui/testing/test-results

      - name: Upload GitHub Actions event data
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: event-data
          path: ${{ github.event_path }}
          overwrite: true
