name: mcp tests

on:
  workflow_dispatch:
  # the release-tests workflow reruns this suite at the released tag
  workflow_call:
  # direct pushes are the norm in this repo — they get the same
  # path-scoped coverage as PRs (rapid push trains collapse through the
  # per-ref concurrency group)
  push:
    branches:
      - 'dev'
    paths:
      - '.github/workflows/mcp-tests.yml'
      - 'mcp/**'
      # the e2e suite serves the slices this generator writes
      - 'docs/build/mcp/**'
      - 'utils/update-notifier/**'
      # root dependency changes affect every package
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    types: [opened, synchronize]
    branches:
      - 'dev'
    paths:
      - '.github/workflows/mcp-tests.yml'
      - 'mcp/**'
      - 'docs/build/mcp/**'
      - 'utils/update-notifier/**'
      # root dependency changes affect every package
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

# literal prefix instead of github.workflow: when called from another
# workflow, github.workflow resolves to the CALLER's name, which would
# collide with the other suites called from the same run
concurrency:
  group: mcp-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    permissions:
      contents: read # to fetch code (actions/checkout)

    runs-on: ubuntu-latest

    name: Tests for the @quasar/mcp package
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      # The e2e suite generates the ui and app-vite docs slices, which
      # needs the built ui package (its generated API files). Same
      # exact-input-hash cache key as app-vite's build-ui job, so runs
      # usually restore instead of building; no restore-keys on purpose
      # — a stale dist must never be served.
      - name: Restore UI build cache
        id: ui-build-cache
        uses: actions/cache@v5
        with:
          path: ui/dist
          key: ui-dist-${{ runner.os }}-${{ hashFiles('ui/src/**', 'ui/lang/**', 'ui/icon-set/**', 'ui/build/**', 'ui/package.json', 'pnpm-lock.yaml') }}

      - name: Build the UI package
        if: steps.ui-build-cache.outputs.cache-hit != 'true'
        run: pnpm --filter quasar build

      - name: Run tests
        run: pnpm --filter @quasar/mcp test
